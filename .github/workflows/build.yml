name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: dotnet run --project tests/Native.Tests -c Release
      - run: npm run build
      - run: npm run validate
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-dial-windows
          path: dist/*.streamDeckPlugin
